services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: car-selling-backend:1.0.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3001
      APP_BASE_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:3000
      MONGODB_URI: mongodb://mongo:27017/car-selling
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '3001:3001'
    volumes:
      - ./public/images:/app/public/images

volumes:
  mongo_data:
